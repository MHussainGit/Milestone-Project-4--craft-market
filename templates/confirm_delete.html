{% extends "base.html" %}
{% block title %}Delete {{ object_name }}{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card text-center">
    <h1>Delete {{ object_name }}?</h1>
    <p class="text-muted">This action cannot be undone.</p>
    <form method="post" style="display:inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete</button>
    </form>
    <a href="{{ cancel_url }}" class="btn btn-secondary" style="margin-left:0.75rem">Cancel</a>
  </div>
</div>
{% endblock %}
