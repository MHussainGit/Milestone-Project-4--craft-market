{% extends "base.html" %}
{% block title %}Check Your Email{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card text-center">
    <h1>Check your email</h1>
    <p>We've sent a password reset link to your email address. The link will expire in 24 hours.</p>
    <p class="text-muted">Didn't receive it? Check your spam folder or
      <a href="{% url 'password_reset' %}">try again</a>.
    </p>
    <a href="{% url 'login' %}" class="btn btn-secondary mt-2">Back to log in</a>
  </div>
</div>
{% endblock %}
